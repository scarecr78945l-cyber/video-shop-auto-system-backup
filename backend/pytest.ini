[pytest]
# M6 API 层（backend/api/）pytest 配置：
# - pythonpath: 将 backend 加入 sys.path（插件/测试导入 api.* 需要）；
# - addopts: 注册 glob 参数展开插件，保证验收命令
#   `python -X utf8 -m pytest tests/test_api_*.py -q --basetemp=".pytest-tmp-m6"`
#   在 Windows（无 shell glob 展开）下也能收集到全部 test_api_* 用例。
# 对不含通配符的命令（各模块既有测试）零影响。
pythonpath = .
addopts = -p api._pytest_glob
