# external-actions.yaml — P0-0 批 C 契约：外部动作注册表
# 来源：round-18 §5.1（21 字段契约 + 最小动作覆盖面）+ round-19 §五（采纳）+ round-38 §3（C1/C2 回修）
# 用途：P0-1 各适配器的外部动作契约唯一依据；官方接口路径仍为 P0-3.5 核对项，当前标「未确认」。

schema_version: "1.0"
source_documents:
  - "14-新立项最终方案.md §7/§8"
  - "15-数据字典.md v6"
frozen_round: "round-19 / round-20 / round-39"
count: 20

# 字段：action_id/platform/capability/read_or_write/account_scope/credential_ref/
#       input_schema/output_schema/gate/idempotency_key_spec/timeout_reconcile_probe/
#       retry_class/evidence_ref/mode/provider/model/source/
#       compensation_action_id/irreversible_effect/owner/current_status
# 规则（round-39 C1/C2 冻结）：
#   - compensation_action_id 值域 = null | 已登记 action_id（闭包：非空引用集合 ⊆ action_id 集合）；
#     人工说明（如「进入审核后不可撤回」）移入 YAML 注释或语义字段，ID 字段只留规范值。
#   - 9 个非创建类 write 的 idempotency_key_spec 统一映射到 idempotency.md 的
#     workflow_steps.action_idempotency_key（logical_action_slot + target_public_id_or_nil），不再使用 action-local 名称。
#   - read 动作不产生平台写；write 动作必须有 gate + idempotency + reconcile + compensation/不可逆说明。
#   - mode: real/mock/fixtures 显式标注；官方接口路径 P0-3.5 核对前一律 current_status: unconfirmed。

entries:
  - action_id: acc_login_probe
    platform: wechat_channels
    capability: 账号/登录探活
    read_or_write: read
    account_scope: account
    credential_ref: credential_refs(openapi/cookie)
    input_schema: {account_id: int}
    output_schema: {login_state: enum_login_state, health_state: enum_health_state}
    gate: none
    idempotency_key_spec: 只读，无需幂等键
    timeout_reconcile_probe: none
    retry_class: TIMEOUT(60s) 有限重试
    evidence_ref: 响应摘要/时间
    mode: real
    provider: wechat
    model: channels
    source: platform
    compensation_action_id: null
    irreversible_effect: false
    owner: platform_session_or_adapter
    current_status: unconfirmed

  - action_id: shop_list_read
    platform: wechat_channels
    capability: 店铺列表读取
    read_or_write: read
    account_scope: account
    credential_ref: credential_refs(openapi/cookie)
    input_schema: {account_id: int}
    output_schema: {shops: [{shop_id, platform_shop_id, status}]}
    gate: none
    idempotency_key_spec: 只读，无需幂等键
    timeout_reconcile_probe: none
    retry_class: TIMEOUT(60s) 有限重试
    evidence_ref: 响应摘要
    mode: real
    provider: wechat
    model: channels
    source: platform
    compensation_action_id: null
    irreversible_effect: false
    owner: platform_session_or_adapter
    current_status: unconfirmed

