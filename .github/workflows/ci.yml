name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend-tests:
    name: 后端 pytest（全量回归）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -r backend/requirements.txt
      - name: 全量测试
        run: |
          cd backend
          python -m pytest tests -q --basetemp=.pytest-tmp-ci
      - name: 上传测试报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/.pytest-tmp-ci/
          retention-days: 7

  frontend-tests:
    name: 前端 vitest + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: cd frontend && npm ci
      - name: 单元测试
        run: cd frontend && npm test
      - name: 类型检查
        run: cd frontend && npx tsc --noEmit
      - name: 生产构建
        run: cd frontend && npm run build
