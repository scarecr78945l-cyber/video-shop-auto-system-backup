name: P0-1 CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  PYTHONUTF8: '1'
  DATABASE_URL: postgresql+psycopg2://dsh:dsh@localhost:5432/dsh_test
  MIGRATION_ROLE: dsh_migrator

jobs:
  # job1 lint
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: compile check
        run: |
          python -m py_compile backend/domain/workflow/queue.py \
            backend/tests/test_workflow_queue.py \
            project/scripts/t9_rollback_drill.py project/scripts/t9_ci_layers.py
      - name: evidence
        if: always()
        run: echo "mode=lint provider=local model=py_compile source=ci.yml evidence=job1"

  # job2 unit（无 DB 依赖：CID/幂等键纯值）
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: install deps
        run: |
          pip install -r backend/requirements.txt
          pip install -r project/requirements.txt
      - name: unit tests (CID golden / idempotency pure)
        run: |
          cd backend
          python -m pytest tests/test_workflow_queue.py -q \
            -k "golden_vectors or canonical_join or run_key or uuid_case or time_normalized"
          python -m pytest tests/test_cid_engine.py -q -k "golden or canonical or envelope"
      - name: evidence
        if: always()
        run: echo "mode=unit provider=local model=pytest source=ci.yml evidence=job2"

  # job3 empty DB + alembic upgrade head
  migration-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dsh
          POSTGRES_PASSWORD: dsh
          POSTGRES_DB: dsh_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dsh" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: install deps
        run: |
          pip install -r backend/requirements.txt
          pip install -r project/requirements.txt
      - name: bootstrap migrator role (R114-2)
        run: |
          psql -h localhost -U dsh -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dsh_migrator LOGIN" \
            -c "GRANT CREATE ON DATABASE dsh_test TO dsh_migrator"
        env: { PGPASSWORD: dsh }
      - name: empty DB + upgrade head
        run: cd project && alembic upgrade head
      - name: evidence
        if: always()
        run: echo "mode=migration provider=postgres:16 model=alembic source=ci.yml evidence=job3-upgrade"

  # job4 catalog exact-set + behavior pytest（独立服务，自备角色 bootstrap）
  catalog-behavior:
    runs-on: ubuntu-latest
    needs: migration-upgrade
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dsh
          POSTGRES_PASSWORD: dsh
          POSTGRES_DB: dsh_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dsh" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: install deps
        run: |
          pip install -r backend/requirements.txt
          pip install -r project/requirements.txt
          cd frontend && npm ci
      - name: bootstrap migrator role (R114-2: fresh service)
        run: |
          psql -h localhost -U dsh -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dsh_migrator LOGIN" \
            -c "GRANT CREATE ON DATABASE dsh_test TO dsh_migrator"
        env: { PGPASSWORD: dsh }
      - name: migrate
        run: cd project && alembic upgrade head
      - name: catalog exact-set
        run: |
          cd project
          python scripts/assert_t9_catalog.py
          python scripts/assert_cid_engine.py
      - name: trigger 17 正反例行为探针 (R116-2)
        run: cd project && python scripts/assert_triggers_probes.py
      - name: T3 约束行为探针 (R118-2: policy fixture 本地补齐)
        run: cd project && python scripts/assert_t3_probes.py
      - name: 离线样本重放 (R118-2: t9-sample-manifest.md §三)
        run: |
          cd backend
          python -m pytest tests/test_ads_fixtures.py tests/test_p2_fixtures.py -q
          python -m pytest tests/test_cid_engine.py tests/test_secret_store.py \
            tests/test_auth_actor.py tests/test_auth_seed.py \
            tests/test_auth_integration.py tests/test_auth_idp_chain.py \
            tests/test_workflow_queue.py -q --basetemp=.pytest-tmp-ci-j4
      - name: frontend tsc
        run: cd frontend && npx tsc --noEmit --incremental false --pretty false
      - name: frontend vitest (R114-2: 保留原有前端单元测试门禁)
        run: cd frontend && npm test
      - name: frontend build (R114-2: 保留原有构建门禁)
        run: cd frontend && npm run build
      - name: evidence
        if: always()
        run: echo "mode=behavior provider=postgres:16 model=alembic+pytest source=ci.yml evidence=job4-catalog-behavior"

  # job5 downgrade base + 空库断言（独立服务，自备角色）
  downgrade-empty:
    runs-on: ubuntu-latest
    needs: catalog-behavior
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dsh
          POSTGRES_PASSWORD: dsh
          POSTGRES_DB: dsh_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dsh" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: install deps
        run: |
          pip install -r backend/requirements.txt
          pip install -r project/requirements.txt
      - name: bootstrap migrator role (R114-2: fresh service)
        run: |
          psql -h localhost -U dsh -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dsh_migrator LOGIN" \
            -c "GRANT CREATE ON DATABASE dsh_test TO dsh_migrator"
        env: { PGPASSWORD: dsh }
      - name: upgrade then downgrade + empty assert
        run: |
          cd project
          alembic upgrade head
          alembic downgrade base
          python scripts/assert_t9_base.py
      - name: evidence
        if: always()
        run: echo "mode=migration provider=postgres:16 model=alembic source=ci.yml evidence=job5-downgrade-empty"

  # job6 真正重升级链（R114-2: 本库 upgrade→downgrade→re-upgrade + 回归）
  re-upgrade:
    runs-on: ubuntu-latest
    needs: downgrade-empty
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dsh
          POSTGRES_PASSWORD: dsh
          POSTGRES_DB: dsh_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dsh" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: install deps
        run: |
          pip install -r backend/requirements.txt
          pip install -r project/requirements.txt
          cd frontend && npm ci
      - name: bootstrap migrator role (R114-2: fresh service)
        run: |
          psql -h localhost -U dsh -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE dsh_migrator LOGIN" \
            -c "GRANT CREATE ON DATABASE dsh_test TO dsh_migrator"
        env: { PGPASSWORD: dsh }
      - name: real re-upgrade chain (R114-2: 本库 upgrade→downgrade→re-upgrade)
        run: |
          cd project
          alembic upgrade head
          alembic downgrade base
          python scripts/assert_t9_base.py
          alembic upgrade head
          python scripts/assert_t9_catalog.py
          python scripts/assert_triggers_probes.py
          python scripts/assert_t3_probes.py
          cd ../backend
          python -m pytest tests/test_ads_fixtures.py tests/test_p2_fixtures.py -q
          python -m pytest tests/test_cid_engine.py tests/test_secret_store.py \
            tests/test_auth_actor.py tests/test_auth_seed.py \
            tests/test_auth_integration.py tests/test_auth_idp_chain.py \
            tests/test_workflow_queue.py -q --basetemp=.pytest-tmp-ci-j6
      - name: evidence
        if: always()
        run: echo "mode=behavior provider=postgres:16 model=alembic+pytest source=ci.yml evidence=job6-reupgrade-chain"
