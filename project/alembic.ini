# P0-1 T1 migration infrastructure (ddl-order.md contract)
# - business_schema = app ; search_path = app, pg_catalog (set in env.py)
# - migration_role = ${MIGRATION_ROLE} (startup required gate, checked in env.py)
# - url = ${DATABASE_URL} (overrides placeholder; env.py)
# NOTE: keep this file pure ASCII for Windows locale portability.

[alembic]
script_location = %(here)s/migrations

# version file template: time + slug (ddl-order wave-friendly)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

prepend_sys_path = .
path_separator = os

# database URL placeholder; actual url comes from env DATABASE_URL in env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
